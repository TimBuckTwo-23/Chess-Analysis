[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-insights"
version = "0.1.0"
description = "Download all your chess.com games and get large-scale insights on strengths, weaknesses and what to study."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chess>=1.10",
    "pandas>=2.0",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",  # zoneinfo has no system time-zone database on Windows
    "zstandard>=0.22",  # reads the Lichess puzzle database (chess-insights puzzles-db)
]

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=0.40"]  # --coach-llm and `chess-insights ask`
maia = ["maia2"]  # --maia: human move probabilities by rating (MIT; pulls in PyTorch)

[project.scripts]
chess-insights = "chess_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess_insights = ["data/*.tsv", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "engine: needs a Stockfish binary (skipped automatically when none is found)",
]
