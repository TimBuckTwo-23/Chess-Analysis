# Run the analysis on GitHub's machines: no install needed, works from a phone.
#   * Actions -> report -> Run workflow: one player, with options; or
#   * edit players.txt on main: a report for every player listed there (engine sample balanced, coaching on).
# The report (with its drill PGNs) is attached to the run (Artifacts) and saved on the `reports` branch.
# Optional repository secrets: LICHESS_TOKEN (opening explorer facts), ANTHROPIC_API_KEY (the LLM coach; the
# Anthropic SDK is installed only when it is set).
# Time: the defaults (300 games at depth 12, coaching 150 positions at depth 20) take about 15 minutes on GitHub's
# 4-CPU runner. Stockfish needs about 0.6 s a game at depth 12 and 2 s at depth 15, so "all" of a few thousand games
# at depth 15 does not fit in one run: the analysis stops after 80 minutes, the games finished so far stay in the
# cache, and the next run carries on from there.
name: report

on:
  workflow_dispatch:
    inputs:
      username:
        description: chess.com username
        required: true
      timezone:
        description: "Your time zone, e.g. America/New_York (optional: local time-of-day stats and the late-night check)"
        required: false
        default: ""
      engine:
        description: Run Stockfish (accuracy, blunders, positions you keep getting wrong, puzzles)
        type: boolean
        default: true
      engine_games:
        description: How many of your games Stockfish analyses (or "all")
        default: "300"
      engine_sample:
        description: "Which games Stockfish analyses: balanced (the same number of bullet, blitz and rapid) or recent"
        type: choice
        options: [balanced, recent]
        default: balanced
      depth:
        description: Stockfish depth per position
        default: "12"
      coach:
        description: Coaching (with the engine) - why each costly move was wrong, puzzle drills, review schedule
        type: boolean
        default: true
      coach_depth:
        description: Stockfish depth for the positions the coaching explains
        default: "20"
      coach_max:
        description: Most positions the coaching explains (costliest first)
        default: "150"
  push:
    branches: [main]
    paths: [players.txt]

permissions:
  contents: write # to save the report on the `reports` branch

jobs:
  players:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          IN_USER: ${{ inputs.username }}
          IN_TZ: ${{ inputs.timezone }}
          IN_ENGINE: ${{ github.event_name != 'workflow_dispatch' || inputs.engine }}
          IN_ENGINE_GAMES: ${{ inputs.engine_games || '300' }}
          IN_DEPTH: ${{ inputs.depth || '12' }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          rows = []
          if os.environ["EVENT"] == "workflow_dispatch":
              rows.append({"username": os.environ["IN_USER"].strip(), "timezone": os.environ["IN_TZ"].strip()})
          elif os.path.exists("players.txt"):
              for line in open("players.txt", encoding="utf-8"):
                  parts = line.split("#", 1)[0].split()
                  if parts:
                      rows.append({"username": parts[0], "timezone": parts[1] if len(parts) > 1 else ""})
          for row in rows:
              # the game cache's key: lowercase, and only what a chess.com username may hold (letters, digits, _ and
              # -), so the "." after it in the key keeps "bob" from restoring the cache of "bob-smith"
              row["cache_name"] = re.sub(r"[^a-z0-9_-]", "", row["username"].lower())
          # Stockfish on GitHub's 4-CPU runner: about 0.6 s a game at depth 12, 2 s at depth 15 (x1.5 a depth)
          games = os.environ["IN_ENGINE_GAMES"].strip().lower()
          depth = int(os.environ["IN_DEPTH"]) if os.environ["IN_DEPTH"].strip().isdigit() else 12
          per_game = 0.6 * 1.5 ** (depth - 12)
          if os.environ["IN_ENGINE"] == "true" and (
                  (games == "all" and depth > 12) or (games.isdigit() and int(games) * per_game > 60 * 60)):
              many = "all your games" if games == "all" else f"{games} games"
              print(f"::warning title=A long engine run::Stockfish on {many} at depth {depth} takes about "
                    f"{per_game:.1f} s a game here, so a large archive may not finish within the 80 minutes the "
                    "analysis gets. Nothing is lost: the games analysed so far are cached, and running the workflow "
                    "again carries on from there. Depth 12 is about three times faster than depth 15.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps({'include': rows})}\ncount={len(rows)}\n")
          print(rows)
          EOF

  report:
    needs: players
    if: needs.players.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1 # one at a time: every job adds a commit to the reports branch
      matrix: ${{ fromJSON(needs.players.outputs.matrix) }}
    env:
      # inputs reach the shell only through environment variables (never pasted into commands)
      USERNAME: ${{ matrix.username }}
      TZ_NAME: ${{ matrix.timezone }}
      ENGINE: ${{ github.event_name != 'workflow_dispatch' || inputs.engine }}
      ENGINE_GAMES: ${{ inputs.engine_games || '300' }}
      ENGINE_SAMPLE: ${{ inputs.engine_sample || 'balanced' }}
      DEPTH: ${{ inputs.depth || '12' }}
      COACH: ${{ github.event_name != 'workflow_dispatch' || inputs.coach }}
      COACH_DEPTH: ${{ inputs.coach_depth || '20' }}
      COACH_MAX: ${{ inputs.coach_max || '150' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Stockfish
        if: env.ENGINE == 'true'
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install chess-insights
        env:
          # only whether the secret is set, never the key itself: the Anthropic SDK (the llm extra, for
          # --coach-llm) is installed when the AI coach can run
          LLM_KEY_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          python -m pip install -U pip
          if [ "$LLM_KEY_SET" = "true" ]; then pip install -e ".[llm]"; else pip install -e .; fi

      # Downloaded months, Stockfish results and the coaching's lines are kept between runs, so a
      # re-run only fetches the current month and analyses new games and positions. Saved after the
      # analysis even when it fails or runs out of time (Stockfish's results are cached game by game),
      # so a re-run carries on where it stopped. (The puzzle database has its own folder and monthly
      # cache below; this path is unchanged so that the caches saved by earlier runs still restore:
      # the second restore key finds the ones saved under the old key, chess-insights-<Username>-<run>.)
      - name: Restore game and engine cache
        uses: actions/cache/restore@v4
        with:
          path: .chess-insights-cache
          key: chess-insights-${{ matrix.cache_name }}.${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chess-insights-${{ matrix.cache_name }}.
            chess-insights-${{ matrix.username }}-

      # The Lichess puzzle database (CC0) for the drills: downloaded at most once a month and kept
      # in its own cache. A failed download never blocks the report (the drills then link to
      # Lichess's theme pages instead).
      - name: Month stamp
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the puzzle database
        id: puzzles
        if: env.ENGINE == 'true' && env.COACH == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .chess-insights-puzzles
          key: lichess-puzzles-${{ steps.month.outputs.month }}
          restore-keys: lichess-puzzles-

      - name: Download the puzzle database (once a month)
        id: puzzles_download
        if: env.ENGINE == 'true' && env.COACH == 'true' && steps.puzzles.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: chess-insights puzzles-db --cache-dir .chess-insights-puzzles

      - name: Save the puzzle database
        if: steps.puzzles_download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .chess-insights-puzzles
          key: lichess-puzzles-${{ steps.month.outputs.month }}

      # The previous report (for progress against its targets and the puzzles due for review).
      - name: Fetch the previous report
        run: |
          name=$(echo "$USERNAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-')
          echo "REPORT_NAME=$name" >> "$GITHUB_ENV"
          previous="$RUNNER_TEMP/previous-$name.json"
          if git fetch --quiet --depth 1 origin reports 2>/dev/null \
             && git show "FETCH_HEAD:$name/latest/$name.json" > "$previous" 2>/dev/null; then
            echo "PREVIOUS_REPORT=$previous" >> "$GITHUB_ENV"
            echo "previous report: $name/latest/$name.json"
          else
            rm -f "$previous"
            echo "no previous report on the reports branch"
          fi

      - name: Analyse games
        id: analyse
        timeout-minutes: 80 # leaves the job's 120 minutes room for setup, the monthly puzzle download and saving
        env:
          # read by chess-insights from the environment, never passed on the command line
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(report "$USERNAME" --cache-dir .chess-insights-cache --out "reports/$REPORT_NAME"
                --contact "https://github.com/$GITHUB_REPOSITORY")
          if [ -n "$TZ_NAME" ]; then args+=(--tz "$TZ_NAME"); fi
          if [ "$ENGINE" = "true" ]; then
            args+=(--engine --stockfish /usr/games/stockfish --engine-games "$ENGINE_GAMES" --depth "$DEPTH"
                   --engine-sample "$ENGINE_SAMPLE" --workers "$(nproc)" --puzzles)
            if [ "$COACH" = "true" ]; then
              args+=(--coach --coach-depth "$COACH_DEPTH" --coach-max "$COACH_MAX")
              if [ -d .chess-insights-puzzles ]; then args+=(--puzzle-db .chess-insights-puzzles); fi
              if [ -n "$ANTHROPIC_API_KEY" ]; then args+=(--coach-llm); fi
            fi
          fi
          if [ -n "${PREVIOUS_REPORT:-}" ]; then args+=(--previous "$PREVIOUS_REPORT"); fi
          chess-insights "${args[@]}"

      - name: Save game and engine cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .chess-insights-cache
          key: chess-insights-${{ matrix.cache_name }}.${{ github.run_id }}-${{ github.run_attempt }}

      - name: Say how to carry on
        if: failure() && steps.analyse.outcome == 'failure'
        run: |
          echo "::error title=No report this time::The analysis did not finish: the 'Analyse games' step says why (it stops after 80 minutes). Whatever it finished is saved in the cache, so running the workflow again carries on from there instead of starting over."

      - name: Attach the report to this run
        uses: actions/upload-artifact@v4
        with:
          name: chess-insights-${{ env.REPORT_NAME }}
          path: reports/
          retention-days: 30

      - name: Save the report on the reports branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          dest="$RUNNER_TEMP/reports-branch"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY"
          git config --global user.name "chess-insights"
          git config --global user.email "chess-insights@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin reports >/dev/null; then
            git clone --quiet --depth 1 --branch reports "$remote" "$dest"
          else
            mkdir -p "$dest" && git -C "$dest" init --quiet -b reports
            git -C "$dest" remote add origin "$remote"
          fi
          mkdir -p "$dest/$REPORT_NAME/$stamp" "$dest/$REPORT_NAME/latest"
          # everything the run wrote: the report files, the puzzle PGN and the drill PGNs
          cp -R reports/. "$dest/$REPORT_NAME/$stamp/"
          rm -rf "$dest/$REPORT_NAME/latest" && mkdir -p "$dest/$REPORT_NAME/latest"
          cp -R reports/. "$dest/$REPORT_NAME/latest/"
          git -C "$dest" add -A
          git -C "$dest" commit --quiet -m "Report for $REPORT_NAME ($stamp)" || exit 0
          # another run may have pushed to the branch meanwhile: put this commit on top of it and try again
          for attempt in 1 2 3; do
            if git -C "$dest" push --quiet origin reports; then exit 0; fi
            sleep $((attempt * 5))
            git -C "$dest" pull --quiet --rebase origin reports || true
          done
          exit 1
