name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # the user's platform: paths, encodings and process start-up differ (tests needing Stockfish skip)
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Stockfish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          CHESS_INSIGHTS_STOCKFISH: ${{ runner.os == 'Linux' && '/usr/games/stockfish' || '' }}
        run: python -m pytest -q
